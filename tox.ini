[tox]
requires =
    tox>=4
env_list = py313, lint, format, docstrings, typecheck
skip_missing_interpreters = true

[testenv]
description = run tests
deps =
    pytest
    pytest-randomly
commands =
    pytest --strict-markers -m "not e2e" {posargs}
passenv =
    REDIS_HOST
    REDIS_PORT
    ECHOLALIA_DIR
    DATASETS_DIR

[testenv:coverage]
description = run tests with code coverage (fails under 25%)
deps =
    pytest
    pytest-randomly
    pytest-cov
commands =
    pytest --strict-markers -m "not e2e" --cov=analysis_service_core --cov-fail-under=25 {posargs}
passenv =
    REDIS_HOST
    REDIS_PORT
    ECHOLALIA_DIR
    DATASETS_DIR

[testenv:e2e]
description = run end-to-end tests (requires Docker)
deps =
    pytest
    pytest-randomly
commands =
    pytest --strict-markers -m e2e {posargs}

[testenv:lint]
description = Lint using flake8
skip_install = true
deps =
    flake8
commands =
    flake8 analysis_service_core

[testenv:format]
description = Check formatting using black, isort, autoflake
skip_install = true
deps =
    black
    isort
    autoflake
commands =
    black --check .
    isort --check-only .
    autoflake --check .

[testenv:docstrings]
description = Check docstrings using pydocstyle
skip_install = true
deps =
    pydocstyle
commands =
    pydocstyle

[testenv:typecheck]
description = Type-check using mypy
skip_install = true
deps =
    mypy
    pytest[mypy]
    redis[mypy]
    types-PyYAML
    click[mypy]
    testcontainers[mypy]
commands =
    mypy analysis_service_core