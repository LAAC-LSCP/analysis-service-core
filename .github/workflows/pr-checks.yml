name: PR Checks (Reusable)

on:
- pull_request
- merge_group

concurrency:
  # Only allow one run at a time of this workflow per PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox
      run: python -m pip install tox
    - name: Run linting checks
      run: tox -e lint
    - name: Run formatting checks
      run: tox -e format
    - name: Run type checks
      run: tox -e typecheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
        - version: "3.13"
          toxenv: "py313"

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: ${{ matrix.python.version }}
    - name: Install tox
      run: python -m pip install tox
    - name: Run unit tests
      run: |
        if [ -d "tests/unit" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/unit --randomly-seed=$RANDOM
        else
          echo "No unit tests found, skipping."
        fi
    - name: Run integration tests
      run: |
        if [ -d "tests/integration" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/integration --randomly-seed=$RANDOM
        else
          echo "No integration tests found, skipping."
        fi
    - name: Run E2E tests
      run: |
        if [ -d "tests/e2e" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/e2e --randomly-seed=$RANDOM
        else
          echo "No e2e tests found, skipping."
        fi