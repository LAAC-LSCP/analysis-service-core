name: PR Checks (Reusable)

on:
- pull_request
- merge_group

concurrency:
  # Only allow one run at a time of this workflow per PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox
      run: python -m pip install tox
    - name: Run linting checks
      run: tox -e lint
    - name: Run formatting checks
      run: tox -e format
    - name: Run type checks
      run: tox -e typecheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
        - version: "3.13"
          toxenv: "py313"

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: ${{ matrix.python.version }}
    - name: Install tox
      run: python -m pip install tox
    - name: Run unit tests
      run: |
        if [ -d "tests/unit" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/unit --randomly-seed=$RANDOM
        else
          echo "No unit tests found, skipping."
        fi
    - name: Run integration tests
      run: |
        if [ -d "tests/integration" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/integration --randomly-seed=$RANDOM
        else
          echo "No integration tests found, skipping."
        fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - uses: docker/setup-buildx-action@v3
      with:
        install: true
    - name: Pre-build worker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: analysis_service_core/tests/word_count_worker/Dockerfile
        push: false
        load: true
        tags: analysis-service-e2e:cache
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Install tox
      run: python -m pip install tox
    - name: Run E2E tests
      run: tox -e e2e -- --randomly-seed=$RANDOM
